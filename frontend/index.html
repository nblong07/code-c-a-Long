    <script>
      // Function to clear local storage
      function clearLocalStorage() {
          localStorage.removeItem('evaluationID');
          localStorage.removeItem('contestSessionID');
          // Add any other items you want to remove here
      }
      
      // Add event listener for beforeunload
      window.addEventListener('beforeunload', function (e) {
          clearLocalStorage();
          
          // The following is optional. It will show a dialog to confirm leaving the page.
          // Most modern browsers no longer display custom messages here.
          e.preventDefault(); // Cancel the event
          e.returnValue = ''; // Chrome requires returnValue to be set
      });
      </script>

    <script>
      /**
       * Kiểm tra xem người dùng đã đăng nhập chưa.
       * Nếu chưa có evaluationID hoặc contestSessionID trong localStorage
       * thì redirect về trang login.
       * (Hiện tại bỏ comment redirect để dễ phát triển)
       */
      if (!localStorage.getItem('evaluationID') || !localStorage.getItem('contestSessionID')) {
        // Bỏ comment dòng dưới để bật chức năng redirect về login khi chưa đăng nhập:
        // window.location.href = 'login.html';
      }

      /**
       * Hàm đăng xuất: xóa session khỏi localStorage và chuyển về trang login.
       */
      function logout() {
        localStorage.removeItem('evaluationID');
        localStorage.removeItem('contestSessionID');
        window.location.href = 'login.html';
      }
    </script>
