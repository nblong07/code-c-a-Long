<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Session</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .login-container {
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        input {
            margin: 0.5rem 0;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            margin-top: 1rem;
            padding: 0.5rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Enter Session</h1>
        <form id="login-form">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Enter</button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const dresBase = window.DRES_BASE || "http://localhost:5000";
                const loginResponse = await fetch(`${dresBase}/api/v2/login`, {
                    method: "POST",
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (loginResponse.ok) {
                    const loginData = await loginResponse.json();
                    const contestSessionID = loginData.sessionId;

                    localStorage.setItem('userName', username);
                    localStorage.setItem('contestSessionID', contestSessionID);

                    const evalResponse = await fetch(`${dresBase}/api/v2/client/evaluation/list?session=${contestSessionID}`);
                    if (evalResponse.ok) {
                        const evalData = await evalResponse.json();
                        if (evalData && evalData.length > 0) {
                            localStorage.setItem('evaluationID', evalData[0].id);
                        }
                    }
                }

                window.location.href = '/index.html';
            } catch (error) {
                console.error('Error during login process:', error);
                window.location.href = '/index.html';
            }
        });
    </script>
</body>
</html>
