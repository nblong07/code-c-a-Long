<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gradAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Rounded Video Frame -->
    <rect x="10" y="10" width="80" height="80" rx="20" fill="url(#gradPrimary)" filter="url(#glow)" opacity="0.95" />
    
    <!-- Play Triangle + Lens Iris -->
    <polygon points="40,32 68,50 40,68" fill="#ffffff" />
    <circle cx="50" cy="50" r="32" fill="none" stroke="url(#gradAccent)" stroke-width="4" stroke-dasharray="140 30" opacity="0.8" />
    
    <!-- AI Sparkles / Dots -->
    <circle cx="78" cy="22" r="5" fill="#10b981" filter="url(#glow)" />
    <circle cx="22" cy="78" r="4" fill="#60a5fa" filter="url(#glow)" />
  </g>

  <!-- Brand Typography -->
  <text x="110" y="62" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="0.5">
    VIDEO<tspan fill="#3b82f6">AI</tspan>
  </text>
  <text x="112" y="88" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="3">
    DINOv2 RETRIEVAL
  </text>
</svg>
