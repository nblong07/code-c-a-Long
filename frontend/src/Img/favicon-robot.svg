<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Cyber Indigo to Neon Cyan Gradient -->
    <linearGradient id="robotBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <linearGradient id="robotFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <filter id="robotGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Robot Antenna -->
  <rect x="46" y="8" width="8" height="14" rx="4" fill="#6366F1" />
  <circle cx="50" cy="8" r="7" fill="#00F2FE" filter="url(#robotGlow)" />
  <circle cx="50" cy="8" r="3" fill="#FFFFFF" />

  <!-- Robot Ears -->
  <rect x="10" y="40" width="8" height="20" rx="4" fill="#6366F1" />
  <rect x="82" y="40" width="8" height="20" rx="4" fill="#6366F1" />

  <!-- Robot Head Frame -->
  <rect x="16" y="20" width="68" height="66" rx="20" fill="url(#robotFaceGrad)" stroke="#00F2FE" stroke-width="3" filter="url(#robotGlow)" />

  <!-- Robot Visor Screen -->
  <rect x="24" y="32" width="52" height="30" rx="10" fill="url(#visorGrad)" stroke="#6366F1" stroke-width="2" />

  <!-- Glowing Robot Eyes -->
  <circle cx="38" cy="47" r="7" fill="#00F2FE" filter="url(#robotGlow)" />
  <circle cx="38" cy="47" r="3" fill="#FFFFFF" />

  <circle cx="62" cy="47" r="7" fill="#00F2FE" filter="url(#robotGlow)" />
  <circle cx="62" cy="47" r="3" fill="#FFFFFF" />

  <!-- Robot Cute Smile -->
  <path d="M 40 68 Q 50 77 60 68" fill="none" stroke="#00F2FE" stroke-width="3.5" stroke-linecap="round" filter="url(#robotGlow)" />
</svg>
