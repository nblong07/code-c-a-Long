<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldFaviconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C068" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8B6508" />
    </linearGradient>
    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Gold Rounded Badge -->
  <rect x="5" y="5" width="90" height="90" rx="20" fill="url(#goldFaviconGrad)" filter="url(#goldShadow)" />
  
  <!-- Outer Gold Ring -->
  <rect x="10" y="10" width="80" height="80" rx="16" fill="none" stroke="#FFF5D6" stroke-width="2.5" opacity="0.8" />
  
  <!-- Trophy Star Accent -->
  <polygon points="50,22 55,34 68,34 57,42 61,54 50,46 39,54 43,42 32,34 45,34" fill="#FFFFFF" />

  <!-- Text AIC 2026 -->
  <text x="50" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="19" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">AIC2026</text>
</svg>
