# ============================================================
# nginx.conf \u2014 C\u1ea5u h\u00ecnh Nginx cho Frontend
# ============================================================
# Nginx s\u1ebd:
#   1. Serve static files (HTML, CSS, JS, \u1ea3nh)
#   2. Proxy /ws/* WebSocket \u0111\u1ebfn backend:8000
#   3. Proxy /api/* REST request \u0111\u1ebfn backend:8000
#   4. Serve th\u01b0 m\u1ee5c keyframe t\u1ea1i /output-keyframes/
# ============================================================

server {
    listen 80;
    server_name localhost;

    # ---- Static frontend files ----
    root /usr/share/nginx/html;
    index index.html;

    # Gửi tất cả request về index.html (Single Page App)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Serve ảnh keyframe ----
    location /keyframes/ {
        alias /usr/share/nginx/html/data-keyframes/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";

        types {
            image/webp webp;
            text/csv  csv;
        }
    }

    # URL: http://localhost:8007/data-keyframes/<video>/<id>.webp hoặc /output-keyframes/
    location /data-keyframes/ {
        alias /usr/share/nginx/html/data-keyframes/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";

        types {
            image/webp webp;
            text/csv  csv;
        }
    }

    location /output-keyframes/ {
        alias /usr/share/nginx/html/output-keyframes/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";

        # Tự detect MIME type cho .webp
        types {
            image/webp webp;
            text/csv  csv;
        }
    }

    # ---- Proxy WebSocket đến backend ----
    location /ws {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;   # Gi\u1eef WS s\u1ed1ng 1 gi\u1edd
        proxy_send_timeout 3600s;
    }

    # ---- Proxy REST API \u0111\u1ebfn backend ----
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ---- Proxy health check ----
    location /health {
        proxy_pass http://backend:8000/health;
    }

    # ---- T\u1eaft log cho favicon \u0111\u1ec3 gi\u1ea3m noise ----
    location = /favicon.ico {
        log_not_found off;
        access_log    off;
    }

    # ---- Compression ----
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1000;
}
