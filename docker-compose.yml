version: '3.8'

# ============================================================
# docker-compose.yml \u2014 Full Stack cho Video Retrieval System
#
# Ch\u1ea1y TO\u00c0N B\u1ed8 h\u1ec7 th\u1ed1ng ch\u1ec9 v\u1edbi 1 l\u1ec7nh:
#   docker compose up -d
#
# D\u1ecbch v\u1ee5 \u0111\u01b0\u1ee3c kh\u1edfi \u0111\u1ed9ng:
#   - milvus-etcd     : Meta store cho Milvus
#   - milvus-minio    : Object store cho Milvus
#   - milvus          : Vector database (port 19530)
#   - backend         : FastAPI server (port 8000)
#   - frontend        : Static file server Nginx (port 8007)
# ============================================================

services:

  # ============================================================
  # MILVUS DEPENDENCIES
  # ============================================================
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - aic-network

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - aic-network

  # ============================================================
  # MILVUS VECTOR DATABASE
  # ============================================================
  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.6.2
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    networks:
      - aic-network

  # ============================================================
  # BACKEND \u2014 FastAPI + CLIP + Milvus
  # ============================================================
  backend:
    container_name: aic-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env                  # Tạo từ .env.example
    environment:
      # Ghi đè MILVUS_URI để backend dùng tên service trong Docker network
      MILVUS_URI: http://milvus:19530
    volumes:
      - ./backend/config.json:/app/config.json:ro   # Read-only config mount
      - ${KEYFRAME_DIR:-./data-keyframes}:/keyframes:ro  # Mount thư mục keyframe
    depends_on:
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      start_period: 120s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - aic-network

  # ============================================================
  # FRONTEND — Nginx serve static files + proxy WebSocket
  # ============================================================
  frontend:
    container_name: aic-frontend
    image: nginx:alpine
    ports:
      - "8007:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro             # Static files
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro  # Nginx config
      - ${KEYFRAME_DIR:-./data-keyframes}:/usr/share/nginx/html/data-keyframes:ro
      - ${KEYFRAME_DIR:-./data-keyframes}:/usr/share/nginx/html/output-keyframes:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - aic-network

# ============================================================
# NETWORKS
# ============================================================
networks:
  aic-network:
    name: aic-network
    driver: bridge
